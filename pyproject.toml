[project]
name = "confidentllm"
version = "0.2.0"
description = "Evaluate the confidence of various LLM models using different confidence methods and generation techniques."
authors = [{ name = "Carel van Niekerk", email = "cvanniekerk@hhu.de" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate >= 0.34",
    "colorlog >= 6.8",
    "datasets >= 2.20",
    "hydra-zen >= 0.13",
    "matplotlib >= 3.9.1",
    "numpy >= 2",
    "pandas >= 2.2.2",
    "pandas-stubs >= 2.2.2.240807",
    "peft >= 0.13.2",
    "pydantic >= 2.8.2",
    "sentencepiece >= 0.2.0",
    "torch >= 2.4.0",
    "transformers < 4.47",
    "trl >= 0.12.0",
    "tqdm >= 4.66.0",
    "types-tqdm >= 4.66.0.20240417",
    "wandb >= 0.17",
]

[dependency-groups]
dev = ["pytest >= 8", "pytest-cov >= 6"]

[tool.uv]
default-groups = []

# Specify the torch version for x86_64 macOS
[tool.uv.sources]
torch = [
    { url = "https://download.pytorch.org/whl/cpu/torch-2.2.0-cp312-none-macosx_10_9_x86_64.whl", marker = "sys_platform == 'darwin'  and platform_machine == 'x86_64'" },
]
numpy = [
    { url = "https://files.pythonhosted.org/packages/95/12/8f2020a8e8b8383ac0177dc9570aad031a3beb12e38847f7129bacd96228/numpy-1.26.4-cp312-cp312-macosx_10_9_x86_64.whl", marker = "sys_platform == 'darwin'  and platform_machine == 'x86_64'" },
]

# Script entry points for various tasks (e.g. question answering)
[project.scripts]
download-and-sync = "confidentllm.scripts:download_and_sync"
dpo-training = "confidentllm.scripts:dpo_training"
mathematical-reasoning = "confidentllm.scripts:mathematical_reasoning"
multiple-choice-qa = "confidentllm.scripts:multiple_choice_qa"
ppo-training = "confidentllm.scripts:ppo_training"
reporting = "confidentllm.scripts:reporting"
reward-model-training = "confidentllm.scripts:reward_model_training"
supervised-finetuning = "confidentllm.scripts:supervised_finetuning"
tests = "pytest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Configuration for Pytest
[tool.pytest.ini_options]
addopts = "--cov confidentllm --verbose --cov-report=term-missing"
filterwarnings = "error::RuntimeWarning"

# Configuration for Ruff (Python linter and formatter)
[tool.ruff]
extend = "~/.config/ruff/config.toml"
target-version = "py312"

# Configuration for Mypy (Python static type checker)
[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = [
    "datasets",
    "hydra-zen",
    "peft",
    "peft.*",
    "torch",
    "transformers",
    "transformers.*",
    "trl",
]
ignore_missing_imports = true
